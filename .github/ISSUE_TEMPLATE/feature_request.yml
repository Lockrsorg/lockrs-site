name: Feature request
description: Suggest a change to the Lockrs website
title: "[feat]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Copy, layout, and site tooling live here.
        Desktop app features belong in [Lockrsorg/lockrs](https://github.com/Lockrsorg/lockrs).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is about the public website (this repo), not the Tauri app
          required: true

  - type: input
    id: discord
    attributes:
      label: Discord username (optional)
      description: If you want to discuss on the [support server](https://discord.gg/DhaSM9FAZE).
      placeholder: e.g. st3ix
