name: Bug report
description: Something on the Lockrs website is broken or wrong
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This repo is the **marketing site** only.
        Desktop app issues go to [Lockrsorg/lockrs](https://github.com/Lockrsorg/lockrs).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run dev
        2. Open /about
        3. …
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / OS (optional)
      placeholder: e.g. Chrome 131 on Windows 11

  - type: input
    id: discord
    attributes:
      label: Discord username (optional)
      description: For follow-up on the [support server](https://discord.gg/DhaSM9FAZE).
      placeholder: e.g. st3ix
