services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

  web-dev:
    profiles:
      - dev
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - website_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm ci && npm run dev:clean"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"

volumes:
  website_node_modules:
